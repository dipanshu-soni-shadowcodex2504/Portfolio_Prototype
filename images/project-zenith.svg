<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="zBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#zBg)"/>
  
  <!-- UI Components floating -->
  <rect x="100" y="80" width="180" height="120" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="url(#zGrad)" stroke-width="1.5"/>
  <rect x="120" y="100" width="60" height="12" rx="4" fill="#818cf8"/>
  <rect x="120" y="125" width="140" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>
  <rect x="120" y="145" width="100" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>
  <rect x="120" y="165" width="80" height="18" rx="4" fill="#c084fc"/>

  <rect x="320" y="80" width="180" height="120" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="350" cy="110" r="14" fill="#38bdf8"/>
  <rect x="375" y="105" width="100" height="10" rx="4" fill="#fff"/>
  <rect x="340" y="140" width="140" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>
  <rect x="340" y="160" width="110" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>

  <text x="300" y="325" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Zenith UI Design System</text>
</svg>
