<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c14" />
      <stop offset="100%" stop-color="#020b08" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#cpBg)"/>
  
  <!-- Wave Graph -->
  <path d="M 50 220 Q 150 120 250 200 T 450 140 T 550 210" fill="none" stroke="url(#emeraldGrad)" stroke-width="4"/>
  <path d="M 50 220 Q 150 120 250 200 T 450 140 T 550 210 L 550 300 L 50 300 Z" fill="url(#emeraldGrad)" opacity="0.15"/>

  <!-- Gauge / Metric Box -->
  <rect x="150" y="60" width="300" height="130" rx="14" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
  <text x="180" y="95" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">CLUSTER_METRICS: HEALTHY (99.99%)</text>
  
  <!-- Bar Indicators -->
  <rect x="180" y="115" width="40" height="50" rx="4" fill="#10b981"/>
  <rect x="230" y="130" width="40" height="35" rx="4" fill="#06b6d4"/>
  <rect x="280" y="105" width="40" height="60" rx="4" fill="#10b981"/>
  <rect x="330" y="120" width="40" height="45" rx="4" fill="#3b82f6"/>
  <rect x="380" y="110" width="40" height="55" rx="4" fill="#10b981"/>

  <text x="300" y="325" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">CloudPulse Telemetry Engine</text>
</svg>
