  <path d="M 390 220 V 250 H 360" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <text x="300" y="165" fill="#f59e0b" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">OBJECT_DETECTED [99.4%]</text>
  <text x="300" y="325" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">VisionFlow Computer Vision</text>
